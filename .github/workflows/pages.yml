name: GitHub Pages

# Custom domain https://grokbottech.com/ is served at the site root, so BASE_PATH
# must be `/` (not `/Claude-Office/`). Vite already reads process.env.BASE_PATH.
#
# Fallback for the project URL https://dinguspingus84acl.github.io/Claude-Office/:
# run this workflow via workflow_dispatch with base_path=/Claude-Office/.
# That preview will 404 asset paths on the custom domain — do not use it for prod.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Vite BASE_PATH. Use / for grokbottech.com (default). Use /Claude-Office/ for the github.io project URL.'
        required: false
        default: '/'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          BASE_PATH: ${{ inputs.base_path || '/' }}
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
